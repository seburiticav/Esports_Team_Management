<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="1024" height="1024">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF5E0"/>
      <stop offset="1" stop-color="#7C7FF5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14182B"/>
      <stop offset="1" stop-color="#0A0C18"/>
    </linearGradient>
  </defs>

  <rect width="520" height="520" rx="110" fill="url(#bg)"/>

  <!-- M gruesa, DETRÁS de las letras para que la E y la S se lean completas -->
  <path d="M68 440 V90 L260 300 L452 90 V440" fill="none" stroke="url(#g2)" stroke-width="20" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- Halo oscuro: separa las letras de la M donde se cruzan -->
  <g fill="none" stroke="#0E1222" stroke-width="52" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M222 142 H112 V378 H222"/>
    <path d="M112 260 H210"/>
    <path d="M408 142 H298 V260 H408 V378 H298"/>
  </g>

  <!-- E (como la del teclado, con sus 3 brazos) y S -->
  <g fill="none" stroke="url(#g1)" stroke-width="36" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M222 142 H112 V378 H222"/>
    <path d="M112 260 H210"/>
    <path d="M408 142 H298 V260 H408 V378 H298"/>
  </g>
</svg>
